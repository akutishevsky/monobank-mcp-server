services:
  monobank-mcp-server:
    build: .
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost:${PORT:-3000},127.0.0.1:${PORT:-3000}}
      - MONOBANK_API_TOKEN=${MONOBANK_API_TOKEN:-}
